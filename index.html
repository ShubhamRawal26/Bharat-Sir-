              let unsubscribeAuth;

                  try {
                      // Import Firebase Dynamically (Using Realtime Database now)
                      const importMod = new Function('module', 'return import(module)');
                      const appModule = await importMod('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');

                      // Your Live Firebase Configuration
                      const firebaseConfig = {
                          apiKey: "AIzaSyAeSXka-gO1nl64OTVIh2vadmQ5NT2yPyw",
                          authDomain: "studio-1309504561-f0565.firebaseapp.com",
                          databaseURL: "https://studio-1309504561-f0565-default-rtdb.firebaseio.com",
                          projectId: "studio-1309504561-f0565",
                          storageBucket: "studio-1309504561-f0565.firebasestorage.app",
                          messagingSenderId: "655456484722",
                          appId: "1:655456484722:web:1320ec0f855fdaac7731eb"
                      };

                      if (!firebaseConfig) {
                          console.warn("No Firebase Config found! Running in local static mode.");
                          setProjects(initialProjects.map((p, i) => ({ id: 'local-'+i, ...p })));
                          return; 
                      }

                      setIsLive(true);
                      const app = appModule.initializeApp(firebaseConfig);
                      const auth = authModule.getAuth(app);
                      const db = dbModule.getDatabase(app);
                      setDbInstance({ db, dbModule });
                      setAuthInstance(auth);
                      setAuthMod(authModule);

                      // Track Real Authentication State
                      unsubscribeAuth = authModule.onAuthStateChanged(auth, (user) => {
                          setFbUser(user);
                          if (user) {
                              setIsAdminAuth(true); // Auto-login if session exists
                          } else {
                              setIsAdminAuth(false);
                          }
                      });

                      // Realtime Database logic for 'projects'
                      const projectsRef = dbModule.ref(db, 'projects');

                      unsubscribeDb = dbModule.onValue(projectsRef, (snapshot) => {
                          const data = snapshot.val();
                          const loadedProjects = [];
                          
                          if (data) {
                              Object.keys(data).forEach(key => {
                                  loadedProjects.push({ id: key, ...data[key] });
                              });
                              loadedProjects.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                              setProjects(loadedProjects);
                          } else {
                              // Seed initial 6 projects to database if empty
                              initialProjects.forEach(async (proj, index) => {
                                  const newProjRef = dbModule.push(dbModule.ref(db, 'projects'));
                                  await dbModule.set(newProjRef, { ...proj, createdAt: Date.now() - index });
                              });
                          }
                      }, (error) => {
                          console.error("Database error:", error);
                      });

                  } catch (error) {
                      console.error("Firebase Setup Error:", error);
                      setProjects(initialProjects.map((p, i) => ({ id: 'local-'+i, ...p })));
                  }
              };
              
              initFirebase();
              return () => { 
                  if (unsubscribeDb) unsubscribeDb();
                  if (unsubscribeAuth) unsubscribeAuth();
              };
          }, []);

                            animate={{ scale: 1, y: 0 }}
                            exit={{ scale: 0.9, y: 20 }}
                            className="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl overflow-hidden my-8"
                        >
                            {/* Close Button */}
                            <button onClick={() => setShowAdminPanel(false)} className="absolute top-6 right-6 p-2 rounded-full bg-zinc-100 hover:bg-red-100 hover:text-red-600 transition-colors z-20">
                                <Icons.X className="w-5 h-5" />
                            </button>

                            {!isAdminAuth ? (
                                /* LOGIN SCREEN */
                                <div className="p-12 md:p-20 text-center">
                                    <div className="w-20 h-20 bg-brand-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                                        <Icons.Lock className="w-10 h-10 text-brand-primary" />
                                    </div>
                                    <h2 className="text-3xl font-black text-brand-dark mb-2">Agency Admin Area</h2>
                                    <p className="text-zinc-500 mb-8">Please login to manage live projects.</p>
                                    
                                    <form onSubmit={handleAdminLogin} className="max-w-sm mx-auto space-y-4 text-left">
                                        <div>
                                            <label className="block text-sm font-bold text-zinc-700 mb-1">Admin Email</label>
                                            <input type="email" value={adminUsername} onChange={e=>setAdminUsername(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-zinc-300 focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all font-medium" placeholder="admin@nexgen.com" required />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-zinc-700 mb-1">Password</label>
                                            <input type="password" value={adminPassword} onChange={e=>setAdminPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-zinc-300 focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 outline-none transition-all font-medium" placeholder="••••••••" required />
                                        </div>
                                        <button type="submit" className="w-full py-4 rounded-xl bg-brand-dark text-white font-bold text-lg hover:bg-brand-primary transition-colors mt-4">
                                            Secure Login
                                        </button>
                                    </form>
                                </div>
                            ) : (
                                /* DASHBOARD SCREEN */
                                <div className="flex flex-col md:flex-row h-full max-h-[80vh]">
                                    
                                    {/* Sidebar / Form */}
                                    <div className="w-full md:w-1/2 p-8 bg-zinc-50 border-r border-zinc-200 overflow-y-auto relative">
                                        <button onClick={handleAdminLogout} type="button" className="absolute top-8 right-8 text-xs font-bold text-red-500 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-full">Logout</button>
                                        <div className="flex items-center gap-3 mb-8">
                                            <Icons.Terminal className="w-6 h-6 text-brand-primary" />
                                            <h2 className="text-2xl font-black text-brand-dark">{isEditing ? 'Edit Project' : 'Add New Project'}</h2>
                                        </div>

                                        <form onSubmit={handleSaveProject} className="space-y-5">
                                            <div>
                                                <label className="block text-sm font-bold text-zinc-700 mb-1">Project Name *</label>
                                                <input type="text" value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-zinc-300 focus:border-brand-primary outline-none" required placeholder="e.g. Apollo Clinic Platform" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-zinc-700 mb-1">Description *</label>
                                                <textarea value={formData.description} onChange={e=>setFormData({...formData, description: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-zinc-300 focus:border-brand-primary outline-none h-24 resize-none" required placeholder="What does this project do?"></textarea>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-zinc-700 mb-1">Image URL (Blob/Link) *</label>
                                                <input type="url" value={formData.image} onChange={e=>setFormData({...formData, image: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-zinc-300 focus:border-brand-primary outline-none" required placeholder="https://..." />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-zinc-700 mb-1">Live Demo Link</label>
                                                <input type="url" value={formData.link} onChange={e=>setFormData({...formData, link: e.target.value})} className="w-full px-4 py-3 rounded-xl border border-zinc-300 focus:border-brand-primary outline-none" placeholder="https://..." />
                                            </div>
                                            
                                            <div className="flex gap-3 pt-4">
                                                <button type="submit" disabled={isSaving} className="flex-1 py-4 rounded-xl bg-brand-primary text-white font-bold flex items-center justify-center gap-2 hover:bg-orange-600 disabled:opacity-50">
                                                    {isSaving ? 'Saving...' : (isEditing ? 'Update Project' : 'Add Project Live')}
                                                </button>
                                                {isEditing && (
                                                    <button type="button" onClick={() => { setIsEditing(false); setFormData({title:'', description:'', image:'', link:''}); setEditId(null); }} className="px-6 py-4 rounded-xl bg-zinc-200 text-brand-dark font-bold hover:bg-zinc-300">
                                                        Cancel
                                                    </button>
                                                )}
                                            </div>
                                        </form>

                                        {!isLive && (
                                            <div className="mt-8 p-4 bg-orange-100 text-orange-800 rounded-xl border border-orange-200 text-sm">
                                                <strong>Notice:</strong> Database is not connected. Changes will not be saved permanently. To make changes permanent, setup Firebase configuration in the code.
                                            </div>
                                        )}
                                    </div>

                                    {/* List of Projects */}
                                    <div className="w-full md:w-1/2 p-8 overflow-y-auto bg-white">
                                        <div className="flex items-center justify-between mb-6 border-b border-zinc-100 pb-4">
                                            <h3 className="text-xl font-bold text-brand-dark">Manage Live Projects</h3>
                                            <span className="text-xs font-bold bg-zinc-100 px-3 py-1 rounded-full text-zinc-500">{projects.length} Total</span>
                                        </div>
                                        
                                        <div className="space-y-4">
                                            {projects.length === 0 ? (
                                                <div className="text-center py-10 text-zinc-400 font-medium">
                                                    Loading projects...
                                                </div>
                                            ) : (
                                                projects.map(proj => (
                                                    <div key={proj.id} className="flex items-center gap-4 p-4 rounded-2xl border border-zinc-200 bg-zinc-50 hover:border-brand-primary transition-colors">
                                                        <img src={proj.image} className="w-16 h-16 rounded-xl object-cover border border-zinc-200" onError={(e)=>{e.target.src='https://via.placeholder.com/100'}} />
                                                        <div className="flex-1 min-w-0">
                                                            <h4 className="font-bold text-brand-dark truncate">{proj.title}</h4>
                                                            <p className="text-xs text-zinc-500 truncate">{proj.link || 'No link'}</p>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <button onClick={() => handleEditClick(proj)} className="p-2 rounded-lg bg-white border border-zinc-200 hover:text-brand-primary shadow-sm" title="Edit"><Icons.Edit className="w-4 h-4" /></button>
                                                            <button onClick={() => handleDeleteProject(proj.id)} className="p-2 rounded-lg bg-white border border-red-200 hover:bg-red-50 hover:text-red-600 shadow-sm" title="Delete"><Icons.Trash className="w-4 h-4" /></button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                </div>
                            )}
                        </motion.div>
                    </motion.div>
                )}
              </AnimatePresence>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
