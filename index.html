<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    
    <title>EduStore - Learn more, Earn more.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkcard: '#1e293b'
                    }
                }
            }
        }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        body { 
            font-family: 'Inter', sans-serif; 
            overscroll-behavior-y: none;
        }
        
        .app-screen { animation: appFadeIn 0.2s ease-out forwards; }
        @keyframes appFadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }

        .loader { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #ffffff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        .loader-dark { border-color: #e2e8f0; border-top-color: #4f46e5; }
        .dark .loader-dark { border-color: #334155; border-top-color: #818cf8; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden bg-slate-50 dark:bg-darkbg text-slate-800 dark:text-slate-100 transition-colors duration-300">

    <div id="toast-container" class="fixed top-safe left-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none mt-4"></div>

    <header id="app-header" class="flex-none bg-white dark:bg-darkcard border-b border-slate-100 dark:border-slate-800 z-40 pt-safe px-4 py-3 flex items-center justify-between shadow-sm transition-colors duration-300"></header>
    
    <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar relative w-full"></main>

    <nav id="bottom-tabs" class="flex-none bg-white dark:bg-darkcard border-t border-slate-200 dark:border-slate-800 z-40 pb-safe transition-colors duration-300"></nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let app, auth, db;
        let currentUser = null;
        let productsList = [];
        let appSettings = { name: "EduStore", logoUrl: "", bannerUrl: "", bannerType: "default" };
        let unsubscribeProducts = null;
        let unsubscribeSettings = null;
        
        const STATE = {
            isAdminAuthenticated: false,
            isUploading: false,
            editingProductId: null,
            currentRoute: 'store', 
            currentParam: null,
            purchasedCourses: JSON.parse(localStorage.getItem('my_courses') || '[]'),
            cart: JSON.parse(localStorage.getItem('my_cart') || '[]'),
            checkoutItems: [] // Items currently in checkout flow
        };

        const appId = 'edustore-prod-app';
        
        const firebaseConfig = {
            apiKey: "AIzaSyD42cki_snTp2kwqvRo-cFPbCb5HTSIt7g",
            authDomain: "studio-3097129257-24f1b.firebaseapp.com",
            databaseURL: "https://studio-3097129257-24f1b-default-rtdb.firebaseio.com",
            projectId: "studio-3097129257-24f1b",
            messagingSenderId: "661770847736",
            appId: "1:661770847736:web:b0af27337899b9de0c020d"
        };

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase init error:", error);
            showToast("Failed to connect to app servers.", "error");
        }

        function showToast(message, type = 'success', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-900 dark:bg-white dark:text-slate-900 text-white' : type === 'error' ? 'bg-red-600 text-white' : 'bg-indigo-600 text-white';
            toast.className = `${bgColor} px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 transition-all duration-300 transform translate-y-0 opacity-100`;
            const icon = type === 'success' ? '<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>' : '<i data-lucide="alert-circle" class="w-5 h-5"></i>';
            toast.innerHTML = `${icon} <span class="text-sm font-semibold flex-1">${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons({ root: toast });
            setTimeout(() => {
                toast.classList.replace('translate-y-0', '-translate-y-4');
                toast.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(amount);
        }

        function getStarsHtml() {
            return `
                <div class="flex items-center gap-0.5 mt-1">
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                    <i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>
                    <span class="text-[10px] font-bold text-slate-400 ml-1">(5.0)</span>
                </div>
            `;
        }

        window.appNavigate = (route, param = null) => {
            STATE.currentRoute = route;
            STATE.currentParam = param;
            renderApp();
        };

        const initAuth = async () => {
            try { await signInAnonymously(auth); } 
            catch (error) { showToast("Auth Error: Check Firebase Auth Rules.", "error", 5000); }
        };

        const setupDataListeners = () => {
            if (!currentUser) return;
            const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main');
            
            unsubscribeProducts = onSnapshot(productsRef, (snapshot) => {
                productsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                productsList.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                renderApp();
            }, (error) => showToast("Firebase Permission Denied. Check DB Rules.", "error", 5000));

            unsubscribeSettings = onSnapshot(settingsRef, (snapshot) => {
                if(snapshot.exists()) {
                    appSettings = { ...appSettings, ...snapshot.data() };
                    renderHeader(); 
                }
                renderApp();
            });
        };

        function renderHeader() {
            const header = document.getElementById('app-header');
            const logoHTML = appSettings.logoUrl 
                ? `<img src="${appSettings.logoUrl}" alt="Logo" class="w-9 h-9 object-cover rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">`
                : `<div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm"><i data-lucide="book-open" class="w-5 h-5"></i></div>`;

            // Back button logic for detail pages
            let leftContent = logoHTML;
            if (['product', 'checkout', 'cart'].includes(STATE.currentRoute)) {
                leftContent = `<button onclick="window.appNavigate('store')" class="p-2 -ml-2 text-slate-600 dark:text-slate-300 active:bg-slate-100 dark:active:bg-slate-800 rounded-full"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>`;
            }

            header.innerHTML = `
                <div class="flex items-center justify-between w-full max-w-xl mx-auto">
                    <div class="flex items-center gap-3">
                        ${leftContent}
                        ${STATE.currentRoute === 'store' || STATE.currentRoute === 'profile' || STATE.currentRoute === 'courses' ? `
                        <div class="flex flex-col justify-center">
                            <span class="font-extrabold text-lg leading-tight text-slate-900 dark:text-white tracking-tight">${appSettings.name || 'EduStore'}</span>
                            <span class="text-[10px] font-bold text-indigo-600 dark:text-indigo-400 tracking-wider uppercase mt-[1px]">Learn more, Earn more.</span>
                        </div>` : `<span class="font-extrabold text-lg text-slate-900 dark:text-white">${
                            STATE.currentRoute === 'cart' ? 'Your Cart' : 
                            STATE.currentRoute === 'checkout' ? 'Secure Checkout' : 'Product Details'
                        }</span>`}
                    </div>
                    
                    <button onclick="window.appNavigate('cart')" class="relative p-2 text-slate-600 dark:text-slate-300 active:bg-slate-100 dark:active:bg-slate-800 rounded-full transition-colors">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                        ${STATE.cart.length > 0 ? `<span class="absolute top-1 right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-white dark:border-darkcard">${STATE.cart.length}</span>` : ''}
                    </button>
                </div>
            `;
            lucide.createIcons({ root: header });
        }

        function renderBottomTabs() {
            const tabs = document.getElementById('bottom-tabs');
            // Hide bottom tabs on detail/checkout pages to simulate real app flow
            if (['product', 'checkout', 'cart'].includes(STATE.currentRoute)) {
                tabs.classList.add('hidden');
                return;
            }
            tabs.classList.remove('hidden');
            
            const activeColor = 'text-indigo-600 dark:text-indigo-400';
            const inactiveColor = 'text-slate-400 dark:text-slate-500';

            tabs.innerHTML = `
                <div class="flex justify-around items-center h-16 w-full max-w-xl mx-auto px-2 relative">
                    <button onclick="window.appNavigate('store')" class="flex flex-col items-center justify-center w-full h-full gap-1 active:scale-95 transition-transform ${STATE.currentRoute === 'store' ? activeColor : inactiveColor}">
                        <i data-lucide="store" class="w-6 h-6 ${STATE.currentRoute === 'store' ? 'fill-indigo-50 dark:fill-indigo-900/30' : ''}"></i>
                        <span class="text-[10px] font-semibold">Store</span>
                    </button>
                    <button onclick="window.appNavigate('courses')" class="flex flex-col items-center justify-center w-full h-full gap-1 active:scale-95 transition-transform ${STATE.currentRoute === 'courses' ? activeColor : inactiveColor}">
                        <i data-lucide="play-square" class="w-6 h-6 ${STATE.currentRoute === 'courses' ? 'fill-indigo-50 dark:fill-indigo-900/30' : ''}"></i>
                        <span class="text-[10px] font-semibold">My Courses</span>
                    </button>
                    <button onclick="window.appNavigate('profile')" class="flex flex-col items-center justify-center w-full h-full gap-1 active:scale-95 transition-transform ${STATE.currentRoute === 'profile' ? activeColor : inactiveColor}">
                        <i data-lucide="user" class="w-6 h-6 ${STATE.currentRoute === 'profile' ? 'fill-indigo-50 dark:fill-indigo-900/30' : ''}"></i>
                        <span class="text-[10px] font-semibold">Profile</span>
                    </button>
                </div>
            `;
            lucide.createIcons({ root: tabs });
        }

        // ==========================================
        // 5. APP SCREENS
        // ==========================================
        function getStoreScreen() {
            let html = `<div class="app-screen w-full max-w-xl mx-auto p-4 space-y-6 pb-8">`;

            if (appSettings.bannerType === 'custom' && appSettings.bannerUrl) {
                html += `<div class="w-full rounded-[2rem] overflow-hidden shadow-lg relative aspect-video bg-slate-100 dark:bg-slate-800 border border-slate-100 dark:border-slate-800"><img src="${appSettings.bannerUrl}" class="w-full h-full object-cover" alt="Advertisement Banner"></div>`;
            } else {
                html += `
                    <div class="bg-gradient-to-br from-indigo-900 to-indigo-700 rounded-[2rem] p-6 text-white shadow-lg relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 opacity-10"><i data-lucide="sparkles" class="w-48 h-48"></i></div>
                        <div class="relative z-10 space-y-2">
                            <span class="bg-white/20 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-widest backdrop-blur-md border border-white/10">Premium Content</span>
                            <h1 class="text-3xl font-extrabold tracking-tight mt-2 leading-tight">Unlock Your<br>Potential</h1>
                            <p class="text-indigo-100 text-sm mt-1 opacity-90 font-medium">Learn more, Earn more.</p>
                        </div>
                    </div>
                `;
            }

            html += `
                <div>
                    <div class="flex items-center justify-between mb-4 px-1">
                        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Trending Courses</h2>
                        <span class="text-xs font-semibold text-slate-400">${productsList.length} items</span>
                    </div>
            `;

            if (productsList.length === 0) {
                html += `
                    <div class="bg-white dark:bg-darkcard rounded-3xl border border-slate-100 dark:border-slate-800 p-10 text-center flex flex-col items-center shadow-sm">
                        <div class="w-16 h-16 bg-slate-50 dark:bg-slate-800 text-slate-300 dark:text-slate-500 rounded-2xl flex items-center justify-center mb-4"><i data-lucide="package-open" class="w-8 h-8"></i></div>
                        <h3 class="text-base font-bold text-slate-800 dark:text-slate-200">Store is Empty</h3>
                        <p class="text-sm text-slate-500 mt-1">Check back later for new content.</p>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 gap-4">`; // LIST VIEW
                productsList.forEach(product => {
                    const imgUrl = product.imageUrl || 'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=600';
                    let priceHtml = product.discountPercent > 0 
                        ? `<span class="text-lg font-black text-slate-900 dark:text-white">${formatCurrency(product.discountedPrice)}</span> <span class="text-xs font-medium text-slate-400 line-through ml-1">${formatCurrency(product.price)}</span>`
                        : `<span class="text-lg font-black text-slate-900 dark:text-white">${formatCurrency(product.price)}</span>`;

                    // Entire card is clickable to open details
                    html += `
                        <div onclick="window.appNavigate('product', '${product.id}')" class="bg-white dark:bg-darkcard rounded-[1.5rem] border border-slate-100 dark:border-slate-800 shadow-sm overflow-hidden flex p-3 gap-4 active:scale-[0.98] transition-transform cursor-pointer">
                            <div class="w-28 h-36 bg-slate-100 dark:bg-slate-800 relative rounded-xl overflow-hidden flex-none">
                                <img src="${imgUrl}" alt="${product.title}" class="w-full h-full object-cover">
                                ${product.discountPercent > 0 ? `<div class="absolute top-2 left-2 bg-rose-500 text-white px-1.5 py-0.5 rounded text-[9px] font-black shadow-sm">${product.discountPercent}% OFF</div>` : ''}
                            </div>
                            <div class="flex flex-col flex-grow py-1 justify-between">
                                <div>
                                    <h3 class="text-sm font-bold text-slate-900 dark:text-slate-100 leading-snug line-clamp-2">${product.title}</h3>
                                    ${getStarsHtml()}
                                </div>
                                <div class="mt-2">${priceHtml}</div>
                                <div class="mt-2 flex items-center gap-1 text-xs font-bold text-indigo-600 dark:text-indigo-400">
                                    View Details <i data-lucide="chevron-right" class="w-3 h-3"></i>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            html += `</div></div>`;
            return html;
        }

        // FULL PRODUCT DETAIL SCREEN
        function getProductDetailScreen(productId) {
            const product = productsList.find(p => p.id === productId);
            if (!product) return `<div class="p-8 text-center text-red-500">Product not found</div>`;
            
            const imgUrl = product.imageUrl || 'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=600';
            const isPurchased = STATE.purchasedCourses.includes(product.id);
            const inCart = STATE.cart.includes(product.id);

            let priceHtml = product.discountPercent > 0 
                ? `<span class="text-3xl font-black text-slate-900 dark:text-white">${formatCurrency(product.discountedPrice)}</span> <span class="text-sm font-semibold text-slate-400 line-through ml-2">${formatCurrency(product.price)}</span> <span class="bg-rose-100 text-rose-600 px-2 py-0.5 rounded-lg text-xs font-bold ml-2">Save ${product.discountPercent}%</span>`
                : `<span class="text-3xl font-black text-slate-900 dark:text-white">${formatCurrency(product.price)}</span>`;

            return `
                <div class="app-screen w-full mx-auto relative h-full flex flex-col bg-white dark:bg-darkbg">
                    <!-- Scrollable Details -->
                    <div class="flex-1 overflow-y-auto no-scrollbar pb-32">
                        <div class="w-full aspect-square md:aspect-video bg-slate-100 dark:bg-slate-800 relative">
                            <img src="${imgUrl}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-6 max-w-xl mx-auto space-y-4">
                            <div>
                                <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white leading-tight">${product.title}</h1>
                                ${getStarsHtml()}
                            </div>
                            
                            <div class="flex items-center border-b border-slate-100 dark:border-slate-800 pb-6 pt-2">
                                ${priceHtml}
                            </div>
                            
                            <div class="pt-2">
                                <h3 class="text-sm font-bold text-slate-900 dark:text-white mb-2 uppercase tracking-wider">Description</h3>
                                <p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed whitespace-pre-wrap">${product.description}</p>
                            </div>
                            
                            <!-- Spacing for bottom bar -->
                            <div class="h-10"></div>
                        </div>
                    </div>

                    <!-- STICKY BOTTOM CALL TO ACTION -->
                    <div class="fixed bottom-0 left-0 w-full bg-white dark:bg-darkcard border-t border-slate-200 dark:border-slate-800 p-4 pb-safe z-50">
                        <div class="max-w-xl mx-auto flex gap-3">
                            ${isPurchased ? `
                                <button onclick="window.appNavigate('courses')" class="w-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 text-sm">
                                    <i data-lucide="check-circle" class="w-5 h-5"></i> You Own This (View Course)
                                </button>
                            ` : `
                                <button onclick="window.appMethods.toggleCart('${product.id}')" class="flex-1 bg-slate-100 dark:bg-slate-800 active:bg-slate-200 text-slate-900 dark:text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm border border-slate-200 dark:border-slate-700">
                                    <i data-lucide="shopping-cart" class="w-5 h-5"></i> ${inCart ? 'Go to Cart' : 'Add to Cart'}
                                </button>
                                <button onclick="window.appMethods.startCheckout('${product.id}')" class="flex-1 bg-indigo-600 active:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm shadow-lg shadow-indigo-600/30">
                                    <i data-lucide="zap" class="w-5 h-5"></i> Buy Now
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // CART SCREEN
        function getCartScreen() {
            let html = `<div class="app-screen w-full max-w-xl mx-auto p-4 space-y-6 pb-24">`;
            
            if (STATE.cart.length === 0) {
                html += `
                    <div class="text-center py-20">
                        <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                            <i data-lucide="shopping-bag" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Your cart is empty</h2>
                        <p class="text-slate-500 mt-2 text-sm">Looks like you haven't added anything yet.</p>
                        <button onclick="window.appNavigate('store')" class="mt-8 bg-indigo-600 text-white font-bold py-3.5 px-8 rounded-2xl shadow-md">Start Shopping</button>
                    </div>
                </div>`;
                return html;
            }

            let total = 0;
            html += `<div class="space-y-4">`;
            STATE.cart.forEach(id => {
                const product = productsList.find(p => p.id === id);
                if(product) {
                    const price = product.discountPercent > 0 ? product.discountedPrice : product.price;
                    total += price;
                    html += `
                        <div class="bg-white dark:bg-darkcard p-3 rounded-[1.5rem] flex gap-4 border border-slate-100 dark:border-slate-800 shadow-sm relative">
                            <img src="${product.imageUrl || 'https://via.placeholder.com/150'}" class="w-20 h-20 rounded-xl object-cover bg-slate-100">
                            <div class="flex-grow py-1 pr-8">
                                <h3 class="font-bold text-slate-900 dark:text-white text-sm line-clamp-2">${product.title}</h3>
                                <p class="text-indigo-600 dark:text-indigo-400 font-black mt-1">${formatCurrency(price)}</p>
                            </div>
                            <button onclick="window.appMethods.removeFromCart('${product.id}')" class="absolute top-3 right-3 p-2 text-slate-400 hover:text-red-500 rounded-lg">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                    `;
                }
            });
            html += `</div>`;
            
            html += `
                <div class="bg-white dark:bg-darkcard p-5 rounded-[1.5rem] border border-slate-100 dark:border-slate-800 shadow-sm">
                    <div class="flex justify-between items-center text-sm font-bold text-slate-600 dark:text-slate-300 mb-2"><span>Subtotal</span><span>${formatCurrency(total)}</span></div>
                    <div class="flex justify-between items-center text-lg font-black text-slate-900 dark:text-white pt-2 border-t border-slate-100 dark:border-slate-800"><span>Total</span><span>${formatCurrency(total)}</span></div>
                </div>
            `;

            html += `</div>
                <div class="fixed bottom-0 left-0 w-full bg-white dark:bg-darkcard border-t border-slate-200 dark:border-slate-800 p-4 pb-safe z-50">
                    <button onclick="window.appMethods.startCheckout('cart')" class="w-full max-w-xl mx-auto block bg-indigo-600 active:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2 text-sm shadow-lg shadow-indigo-600/30">
                        Proceed to Checkout <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            `;
            return html;

        // ==========================================
        // 6. EVENT BINDING & APP RENDERER
        // ==========================================
        function renderApp() {
            renderHeader();
            renderBottomTabs();
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            mainContent.scrollTop = 0;
            
            if (STATE.currentRoute === 'admin') {
                if (STATE.isAdminAuthenticated) { mainContent.innerHTML = getAdminDashboardScreen(); bindAdminEvents(); } 
                else { mainContent.innerHTML = getAdminLoginScreen(); bindLoginEvents(); }
            } else if (STATE.currentRoute === 'product') { mainContent.innerHTML = getProductDetailScreen(STATE.currentParam);
            } else if (STATE.currentRoute === 'cart') { mainContent.innerHTML = getCartScreen();
            } else if (STATE.currentRoute === 'checkout') { mainContent.innerHTML = getCheckoutScreen();
            } else if (STATE.currentRoute === 'courses') { mainContent.innerHTML = getMyCoursesScreen();
            } else if (STATE.currentRoute === 'profile') { mainContent.innerHTML = getProfileScreen();
            } else { mainContent.innerHTML = getStoreScreen(); }
            lucide.createIcons();
        }

        window.appMethods = {
            toggleCart: (productId) => {
                if (STATE.cart.includes(productId)) {
                    window.appNavigate('cart');
                } else {
                    STATE.cart.push(productId);
                    localStorage.setItem('my_cart', JSON.stringify(STATE.cart));
                    showToast("Added to Cart!", "success");
                    renderHeader(); // update badge
                    window.appNavigate('cart'); // Redirect to cart as requested
                }
            },
            removeFromCart: (productId) => {
                STATE.cart = STATE.cart.filter(id => id !== productId);
                localStorage.setItem('my_cart', JSON.stringify(STATE.cart));
                renderApp();
            },
            startCheckout: (param) => {
                window.appNavigate('checkout', param);
            },
            processCheckout: () => {
                // Get form values
                const name = document.getElementById('chk-name').value;
                const mobile = document.getElementById('chk-mobile').value;
                const email = document.getElementById('chk-email').value;
                const cls = document.getElementById('chk-class').value;

                if(!name || !mobile || !email || !cls) {
                    showToast("Please fill all details", "error");
                    return;
                }

                // Get payment link from the first item (standard for single checkout apps without complex backends)
                const mainItem = STATE.checkoutItems[0];
                
                if (mainItem && mainItem.paymentLink) {
                    window.open(mainItem.paymentLink, '_blank');
                    showToast("Opening Secure Gateway...", "info", 2000);
                    
                    // Demo Simulation: Adds items to My Courses simulating successful payment
                    setTimeout(() => { 
                        if(confirm("DEMO Flow: Did you complete the payment successfully? (Adds to My Courses)")) { 
                            STATE.checkoutItems.forEach(item => {
                                if(!STATE.purchasedCourses.includes(item.id)) {
                                    STATE.purchasedCourses.push(item.id);
                                    window.appMethods.incrementPurchase(item.id);
                                }
                            });
                            localStorage.setItem('my_courses', JSON.stringify(STATE.purchasedCourses));
                            STATE.cart = []; // Clear cart on success
                            localStorage.setItem('my_cart', JSON.stringify(STATE.cart));
                            window.appNavigate('courses');
                            showToast("Course unlocked! Check 'My Courses'", "success", 4000);
                        } 
                    }, 2000);
                }
            },
            incrementPurchase: async (productId) => {
                try {
                    const productRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productId);
                    const p = productsList.find(p => p.id === productId);
                    if (p) await updateDoc(productRef, { purchases: (p.purchases || 0) + 1 });
                } catch (e) {}
            },
            logoutAdmin: () => { STATE.isAdminAuthenticated = false; window.appNavigate('profile'); },
            deleteProduct: async (productId) => {
                if (!confirm("Delete product?")) return;
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productId)); showToast("Deleted"); }
                catch (e) { showToast("Failed to delete", "error"); }
            },
            editProduct: (productId) => {
                const p = productsList.find(x => x.id === productId);
                if (!p) return;
                STATE.editingProductId = productId;
                document.getElementById('prod-title').value = p.title;
                document.getElementById('prod-desc').value = p.description;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-disc-price').value = p.discountedPrice;
                document.getElementById('prod-paylink').value = p.paymentLink;
                document.getElementById('prod-drive-link').value = p.driveLink;
                
                document.getElementById('form-title').innerHTML = '<i data-lucide="edit-3" class="w-6 h-6 text-indigo-600"></i> Edit Product';
                document.getElementById('submit-btn').innerHTML = '<i data-lucide="save" class="w-5 h-5"></i> Update Product';
                document.getElementById('cancel-edit-btn').classList.remove('hidden');
                document.getElementById('edit-img-note').classList.remove('hidden');
                
                window.appMethods.calculateDiscount();
                document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
                lucide.createIcons();
            },
            cancelEdit: () => {
                STATE.editingProductId = null;
                document.getElementById('add-product-form').reset();
                document.getElementById('form-title').innerHTML = '<i data-lucide="plus-circle" class="w-6 h-6 text-indigo-600"></i> Add Product';
                document.getElementById('submit-btn').innerHTML = '<i data-lucide="upload-cloud" class="w-5 h-5"></i> Publish Product';
                document.getElementById('cancel-edit-btn').classList.add('hidden');
                document.getElementById('edit-img-note').classList.add('hidden');
                document.getElementById('discount-badge').classList.add('hidden');
                lucide.createIcons();
            },
            toggleDark: () => {
                document.documentElement.classList.toggle('dark');
                localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                renderApp(); 
            },
            calculateDiscount: () => {
                const orig = parseFloat(document.getElementById('prod-price').value);
                const disc = parseFloat(document.getElementById('prod-disc-price').value);
                const badge = document.getElementById('discount-badge');
                const val = document.getElementById('discount-val');
                if(orig > 0 && disc >= 0 && orig > disc) {
                    const percent = Math.round(((orig - disc) / orig) * 100);
                    val.innerText = percent;
                    badge.classList.remove('hidden');
                } else { badge.classList.add('hidden'); }
            }
        };

        function bindLoginEvents() {
            const form = document.getElementById('admin-login-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const id = document.getElementById('admin-id').value.trim().toLowerCase();
                    const pass = document.getElementById('admin-pass').value.trim();
                    if (id === 'admin' && pass === 'password123') {
                        STATE.isAdminAuthenticated = true;
                        renderApp();
                    } else { showToast("Invalid credentials", "error"); }
                });
            }
        }

        const processImageToBase64 = async (file, type = 'product') => {
            if (!file) return null;
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let MAX_DIM = 1080;
                            if (type === 'banner') MAX_DIM = 1920;
                            if (type === 'logo') MAX_DIM = 400; 
                            
                            let width = img.width;
                            let height = img.height;
                            
                            if (width > height) {
                                if (width > MAX_DIM) { height = Math.round((height * MAX_DIM) / width); width = MAX_DIM; }
                            } else {
                                if (height > MAX_DIM) { width = Math.round((width * MAX_DIM) / height); height = MAX_DIM; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            let quality = 0.90;
                            let base64String = canvas.toDataURL('image/jpeg', quality);
                            
                            while (base64String.length > 900000 && quality > 0.3) {
                                quality -= 0.1;
                                base64String = canvas.toDataURL('image/jpeg', quality);
                            }
                            if (base64String.length > 1000000) { reject(new Error("Image is too large for database.")); return; }
                            resolve(base64String);
                        } catch (err) { reject(new Error("Image processing failed.")); }
                    };
                    img.onerror = () => reject(new Error("Invalid image format."));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Failed to read file."));
                reader.readAsDataURL(file);
            });
        };

        function bindAdminEvents() {
            const addForm = document.getElementById('add-product-form');
            if (addForm) {
                addForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (STATE.isUploading) return;
                    const btn = document.getElementById('submit-btn');
                    const originalBtnContent = btn.innerHTML;
                    try {
                        STATE.isUploading = true;
                        btn.innerHTML = `<span class="loader loader-dark"></span> <span class="ml-2">Saving...</span>`;
                        btn.disabled = true;
                        
                        const title = document.getElementById('prod-title').value;
                        const desc = document.getElementById('prod-desc').value;
                        const price = parseFloat(document.getElementById('prod-price').value);
                        const discountedPrice = parseFloat(document.getElementById('prod-disc-price').value);
                        const payLink = document.getElementById('prod-paylink').value;
                        const driveLink = document.getElementById('prod-drive-link').value;
                        const imageFile = document.getElementById('prod-image').files[0];
                        
                        let discountPercent = 0;
                        if(price > 0 && discountedPrice < price) {
                            discountPercent = Math.round(((price - discountedPrice) / price) * 100);
                        }

                        let imageUrl = null;
                        if (imageFile) imageUrl = await processImageToBase64(imageFile, 'product');
                        
                        const payload = {
                            title, description: desc, price, discountedPrice, discountPercent, paymentLink: payLink, driveLink
                        };

                        if (STATE.editingProductId) {
                            if (imageUrl) payload.imageUrl = imageUrl;
                            const dbPromise = updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', STATE.editingProductId), payload);
                            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Database timeout.")), 10000));
                            await Promise.race([dbPromise, timeoutPromise]);
                            showToast("Product Updated!", "success");
                            window.appMethods.cancelEdit(); 
                        } else {
                            payload.imageUrl = imageUrl;
                            payload.purchases = 0;
                            payload.createdAt = new Date().toISOString();
                            
                            const dbPromise = addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), payload);
                            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Database timeout.")), 10000));
                            await Promise.race([dbPromise, timeoutPromise]);
                            showToast("Product Created!", "success"); 
                            addForm.reset(); 
                            document.getElementById('discount-badge').classList.add('hidden');
                        }
                    } catch (error) { 
                        showToast(error.message || "Failed to save product", "error", 6000); 
                    } finally { 
                        STATE.isUploading = false; 
                        btn.innerHTML = originalBtnContent; 
                        btn.disabled = false; 
                        lucide.createIcons();
                    }
                });
            }
            
            const setForm = document.getElementById('settings-form');
            if (setForm) {
                setForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('settings-submit-btn');
                    const origText = btn.innerHTML;
                    try {
                        btn.innerHTML = `<span class="loader loader-dark"></span>`;
                        btn.disabled = true;

                        const newName = document.getElementById('set-app-name').value;
                        const logoFile = document.getElementById('set-app-logo-file').files[0];
                        let newLogoUrl = appSettings.logoUrl;
                        if (logoFile) newLogoUrl = await processImageToBase64(logoFile, 'logo');

                        const bannerType = document.getElementById('set-app-banner-type').value;
                        const bannerFile = document.getElementById('set-app-banner').files[0];
                        let newBannerUrl = appSettings.bannerUrl;
                        if (bannerFile) newBannerUrl = await processImageToBase64(bannerFile, 'banner');

                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), { 
                            name: newName, logoUrl: newLogoUrl, bannerType: bannerType, bannerUrl: newBannerUrl
                        }, { merge: true });
                        
                        showToast("Config Saved!", "success");
                    } catch (error) { showToast("Error saving settings", "error", 6000); 
                    } finally { btn.innerHTML = origText; btn.disabled = false; }
                });
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('main-content').innerHTML = `<div class="flex justify-center items-center h-full"><span class="loader border-indigo-600"></span></div>`;
            const setHeight = () => document.body.style.height = window.innerHeight + 'px';
            window.addEventListener('resize', setHeight); setHeight();

            await initAuth();
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) setupDataListeners();
            });
            setTimeout(renderApp, 400);
        });
    </script>
