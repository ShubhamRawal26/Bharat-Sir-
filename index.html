<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStore - Learn more, Earn more.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Styles & Animations */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4f46e5; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Main Application Wrapper -->
    <div id="app-root" class="flex flex-col min-h-screen w-full">
        <!-- Header will be injected here -->
        <header id="app-header"></header>
        
        <!-- Main Content Area -->
        <main id="main-content" class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

        <!-- Footer will be injected here -->
        <footer id="app-footer"></footer>
    </div>

    <script type="module">
        // ==========================================
        // 1. FIREBASE INITIALIZATION & IMPORTS
        // ==========================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        let app, auth, db, storage;
        let currentUser = null;
        let productsList = [];
        let appSettings = { name: "EduStore", logoUrl: "" };
        let unsubscribeProducts = null;
        let unsubscribeSettings = null;
        
        // App State
        const STATE = {
            isAdminAuthenticated: false,
            isUploading: false,
            isSavingSettings: false
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'edustore-demo-app';
        let firebaseConfig = {
          apiKey: "AIzaSyAUsElQzqYW_Ldp8iU-3UTMPokx-bfWV4Q",
          authDomain: "studio-7023892107-9c9ae.firebaseapp.com",
          databaseURL: "https://studio-7023892107-9c9ae-default-rtdb.firebaseio.com",
          projectId: "studio-7023892107-9c9ae",
          storageBucket: "studio-7023892107-9c9ae.firebasestorage.app",
          messagingSenderId: "825837550877",
          appId: "1:825837550877:web:a10213195396e05007f5f4"
        };

        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            storage = getStorage(app);
        } catch (error) {
            console.error("Firebase init error:", error);
            showToast("Failed to initialize database connection.", "error");
        }

        // ==========================================
        // 2. CORE UTILITIES
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 fade-in transition-opacity duration-300`;
            
            const icon = type === 'success' ? '<i data-lucide="check-circle"></i>' : '<i data-lucide="alert-circle"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons({ root: toast });

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
        }

        // ==========================================
        // 3. FIREBASE AUTH & DATA FETCHING
        // ==========================================
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                showToast("Authentication failed.", "error");
            }
        };

        const setupDataListeners = () => {
            if (!currentUser) return;
            
            // STRICT PATHS
            const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main');
            
            unsubscribeProducts = onSnapshot(productsRef, (snapshot) => {
                productsList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                handleRoute();
            }, (error) => console.error("Products Error:", error));

            unsubscribeSettings = onSnapshot(settingsRef, (snapshot) => {
                if(snapshot.exists()) {
                    appSettings = { ...appSettings, ...snapshot.data() };
                }
                handleRoute();
            }, (error) => console.error("Settings Error:", error));
        };

        // ==========================================
        // 4. UI COMPONENTS (RENDERERS)
        // ==========================================
        const renderHeader = () => {
            const currentHash = window.location.hash || '#home';
            
            const logoDisplay = appSettings.logoUrl 
                ? `<img src="${appSettings.logoUrl}" alt="Logo" class="w-8 h-8 object-contain rounded">`
                : `<div class="bg-indigo-600 text-white p-2 rounded-lg"><i data-lucide="book-open" class="w-5 h-5"></i></div>`;

            const navHTML = `
                <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between h-16">
                            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.hash='#home'">
                                ${logoDisplay}
                                <div class="flex flex-col">
                                    <span class="font-bold text-xl leading-tight text-slate-900">${appSettings.name || 'EduStore'}</span>
                                    <span class="text-[10px] font-semibold text-indigo-600 tracking-wider uppercase">Learn more, Earn more.</span>
                                </div>
                            </div>
                            <div class="flex items-center space-x-4 sm:space-x-8">
                                <a href="#home" class="${currentHash === '#home' || currentHash === '' ? 'text-indigo-600 font-semibold border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-900'} px-3 py-2 text-sm transition-colors flex items-center gap-2">
                                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Products
                                </a>
                                <!-- User App: Admin link removed from main header for security -->
                            </div>
                        </div>
                    </div>
                </nav>
            `;
            document.getElementById('app-header').innerHTML = navHTML;
        };

        const renderFooter = () => {
            const footerHTML = `
                <div class="bg-white border-t border-slate-200 mt-auto">
                    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-900 font-semibold">${appSettings.name || 'EduStore'}</span>
                        </div>
                        <p class="text-slate-500 text-sm">© ${new Date().getFullYear()} ${appSettings.name || 'EduStore'}. "Learn more, Earn more."</p>
                        <div class="flex gap-4 items-center">
                            <a href="#" class="text-slate-400 hover:text-indigo-600 transition-colors"><i data-lucide="twitter" class="w-5 h-5"></i></a>
                            <a href="#" class="text-slate-400 hover:text-indigo-600 transition-colors"><i data-lucide="github" class="w-5 h-5"></i></a>
                            
                            <!-- Discreet Admin Login Icon -->
                            <div class="w-px h-4 bg-slate-300 mx-1"></div>
                            <a href="#admin" title="Admin Login" class="text-slate-300 hover:text-slate-600 transition-colors"><i data-lucide="shield" class="w-4 h-4"></i></a>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app-footer').innerHTML = footerHTML;
        };

        const renderHome = () => {
            let html = `
                <div class="fade-in space-y-12">
                    <div class="bg-gradient-to-br from-indigo-900 to-slate-800 rounded-3xl p-8 sm:p-16 text-center shadow-xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                        <div class="relative z-10 max-w-3xl mx-auto space-y-6">
                            <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight">Unlock Your Potential</h1>
                            <p class="text-xl text-indigo-200 font-light">Get access to premium educational resources, guides, and masterclasses. <strong class="text-white font-semibold">Learn more, Earn more.</strong></p>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-8">
                            <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="sparkles" class="text-indigo-500"></i> Featured Digital Products
                            </h2>
                        </div>
            `;

            if (productsList.length === 0) {
                html += `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 border-dashed">
                        <i data-lucide="package-open" class="w-16 h-16 text-slate-300 mx-auto mb-4"></i>
                        <h3 class="text-lg font-medium text-slate-900">No products available yet</h3>
                        <p class="text-slate-500 mt-1">Check back later for new educational content.</p>
                    </div>
                `;
            } else {
                html += `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">`;
                productsList.forEach(product => {
                    const imgUrl = product.imageUrl || 'https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=600';
                    html += `
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col group">
                            <div class="aspect-w-16 aspect-h-10 w-full overflow-hidden bg-slate-100 relative">
                                <img src="${imgUrl}" alt="${product.title}" class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-bold text-slate-900 shadow-sm">
                                    ${formatCurrency(product.price)}
                                </div>
                            </div>
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="text-lg font-bold text-slate-900 mb-2 line-clamp-1">${product.title}</h3>
                                <p class="text-slate-600 text-sm line-clamp-2 mb-6 flex-grow">${product.description}</p>
                                
                                <button onclick="window.appMethods.handleBuy('${product.id}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm shadow-indigo-200">
                                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Get Access Now
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            html += `</div></div>`;
            return html;
        };

        const renderAdminLogin = () => {
            return `
                <div class="fade-in max-w-md mx-auto mt-12 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="shield-check" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900">Secure Admin Panel</h2>
                        <p class="text-slate-500 text-sm mt-2">Authorized personnel only.</p>
                    </div>
                    
                    <form id="admin-login-form" class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Admin ID</label>
                            <input type="text" id="admin-id" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                            <input type="password" id="admin-pass" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" required>
                        </div>
                        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-slate-200">
                            <i data-lucide="log-in" class="w-4 h-4"></i> Authenticate
                        </button>
                    </form>
                </div>
            `;
        };

        const renderAdminDashboard = () => {
            const totalPurchases = productsList.reduce((sum, p) => sum + (p.purchases || 0), 0);
            
            let html = `
                <div class="fade-in space-y-8">
                    <!-- Top Bar -->
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200 gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900">Admin Dashboard</h1>
                            <p class="text-slate-500 text-sm">Manage products, settings, and track sales.</p>
                        </div>
                        <button onclick="window.appMethods.logoutAdmin()" class="text-red-600 hover:bg-red-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 border border-transparent hover:border-red-100">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                        </button>
                    </div>

                    <!-- Analytics Row -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="bg-indigo-600 text-white p-6 rounded-2xl shadow-sm flex items-center gap-4">
                            <div class="bg-indigo-500/50 p-4 rounded-xl"><i data-lucide="package" class="w-8 h-8"></i></div>
                            <div>
                                <p class="text-indigo-100 text-sm font-medium">Total Products Listed</p>
                                <h3 class="text-3xl font-bold">${productsList.length}</h3>
                            </div>
                        </div>
                        <div class="bg-emerald-600 text-white p-6 rounded-2xl shadow-sm flex items-center gap-4">
                            <div class="bg-emerald-500/50 p-4 rounded-xl"><i data-lucide="trending-up" class="w-8 h-8"></i></div>
                            <div>
                                <p class="text-emerald-100 text-sm font-medium">Successful Sales (Views)</p>
                                <h3 class="text-3xl font-bold">${totalPurchases}</h3>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <!-- Left Column: Add Product Form -->
                        <div class="lg:col-span-1 space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                                <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                                    <i data-lucide="plus-circle" class="text-indigo-600"></i> Add New Product
                                </h2>
                                <form id="add-product-form" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Product Title</label>
                                        <input type="text" id="prod-title" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                                        <textarea id="prod-desc" required rows="3" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm"></textarea>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Price (USD)</label>
                                        <input type="number" id="prod-price" required min="0" step="0.01" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Payment Gateway Link</label>
                                        <input type="url" id="prod-paylink" required placeholder="e.g., Stripe Payment Link" class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                                    </div>
                                    <div class="border-t border-slate-200 pt-4 mt-2">
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Cover Image</label>
                                        <input type="file" id="prod-image" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Digital Product (PDF)</label>
                                        <input type="file" id="prod-pdf" accept="application/pdf" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                                    </div>
                                    <button type="submit" id="submit-btn" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                                        <i data-lucide="upload-cloud" class="w-4 h-4"></i> Create Product
                                    </button>
                                </form>
                            </div>
                        </div>

                        <!-- Right Column: Settings & Directory -->
                        <div class="lg:col-span-2 space-y-6">
                            
                            <!-- Global Settings -->
                            <div class="bg-slate-900 p-6 rounded-2xl shadow-sm text-white">
                                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                                    <i data-lucide="settings" class="text-slate-400"></i> Global App Settings
                                </h2>
                                <form id="settings-form" class="flex flex-col sm:flex-row gap-4 items-end">
                                    <div class="w-full">
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Application Name</label>
                                        <input type="text" id="set-app-name" value="${appSettings.name || ''}" class="w-full px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm text-white" placeholder="EduStore">
                                    </div>
                                    <div class="w-full">
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Logo URL (Optional)</label>
                                        <input type="url" id="set-app-logo" value="${appSettings.logoUrl || ''}" class="w-full px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none text-sm text-white" placeholder="https://...">
                                    </div>
                                    <button type="submit" class="w-full sm:w-auto bg-white text-slate-900 hover:bg-slate-100 font-medium py-2 px-6 rounded-lg transition-colors shrink-0">
                                        Save
                                    </button>
                                </form>
                            </div>

                            <!-- Product Directory -->
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <div class="flex justify-between items-center mb-6">
                                    <h2 class="text-lg font-bold text-slate-900">Product Directory</h2>
                                    <button onclick="window.appMethods.seedDemoData()" class="text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded text-sm font-medium border border-indigo-200 transition-colors flex items-center gap-2">
                                        <i data-lucide="database" class="w-4 h-4"></i> Add Demo Products
                                    </button>
                                </div>
            `;

            if (productsList.length === 0) {
                html += `
                    <div class="bg-slate-50 p-8 rounded-xl border border-slate-200 border-dashed text-center text-slate-500">
                        No products listed yet. Add one or seed demo data!
                    </div>
                `;
            } else {
                html += `<div class="space-y-4">`;
                productsList.forEach(product => {
                    const secretUrl = `${window.location.origin}${window.location.pathname}#access/${product.id}`;
                    html += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between hover:border-indigo-300 transition-colors">
                            <div class="flex items-center gap-4 w-full">
                                <img src="${product.imageUrl || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded object-cover border border-slate-100">
                                <div class="flex-grow">
                                    <h3 class="font-bold text-slate-900 text-sm">${product.title}</h3>
                                    <div class="flex items-center gap-4 mt-1 text-xs">
                                        <span class="text-emerald-600 font-medium">${formatCurrency(product.price)}</span>
                                        <span class="text-slate-500"><i data-lucide="activity" class="w-3 h-3 inline mr-1"></i>${product.purchases || 0} Sales</span>
                                    </div>
                                    <div class="mt-2 flex items-center gap-2 text-xs text-rose-600 bg-rose-50 py-1 px-2 rounded w-fit relative group cursor-help border border-rose-100">
                                        <i data-lucide="lock-keyhole" class="w-3 h-3"></i> 
                                        <span class="font-semibold">Secret URL:</span> <span class="truncate max-w-[150px] inline-block align-bottom">${secretUrl}</span>
                                        <button onclick="window.appMethods.copyText('${secretUrl}')" class="ml-2 text-rose-800 hover:text-rose-900"><i data-lucide="copy" class="w-3 h-3"></i></button>
                                    </div>
                                </div>
                            </div>
                            <button onclick="window.appMethods.deleteProduct('${product.id}')" class="text-slate-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg transition-colors shrink-0">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            html += `</div></div></div></div>`;
            return html;
        };

        const renderAccessView = (productId) => {
            const product = productsList.find(p => p.id === productId);
            
            if (!product) {
                return `
                    <div class="fade-in max-w-md mx-auto mt-20 text-center bg-white p-8 rounded-3xl shadow-lg border border-slate-100">
                        <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i data-lucide="shield-alert" class="w-10 h-10"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 mb-2">Access Denied</h2>
                        <p class="text-slate-500 mb-8">This digital product does not exist or the link is invalid.</p>
                        <button onclick="window.location.hash='#home'" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-medium hover:bg-slate-800 transition">Return Home</button>
                    </div>
                `;
            }

            return `
                <div class="fade-in max-w-4xl mx-auto bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
                    <div class="bg-indigo-600 p-8 text-center sm:text-left sm:flex justify-between items-center text-white">
                        <div>
                            <span class="bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 inline-block">Purchase Successful</span>
                            <h1 class="text-3xl font-bold">${product.title}</h1>
                            <p class="text-indigo-200 mt-2 text-sm max-w-xl">Thank you for your purchase! Your digital product is ready. "Learn more, Earn more."</p>
                        </div>
                        <div class="mt-6 sm:mt-0">
                            <i data-lucide="check-circle" class="w-16 h-16 text-emerald-400 mx-auto sm:mx-0"></i>
                        </div>
                    </div>
                    
                    <div class="p-8 sm:p-12 text-center">
                        <div class="border-4 border-dashed border-slate-100 rounded-2xl p-10 bg-slate-50 max-w-lg mx-auto">
                            <i data-lucide="file-text" class="w-24 h-24 text-rose-500 mx-auto mb-6"></i>
                            <h3 class="text-xl font-bold text-slate-900 mb-4">Your PDF Document is Ready</h3>
                            
                            <div class="flex flex-col sm:flex-row gap-4 justify-center mt-8">
                                <a href="${product.pdfUrl}" target="_blank" class="bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-6 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-slate-200">
                                    <i data-lucide="eye" class="w-5 h-5"></i> View Online
                                </a>
                                <a href="${product.pdfUrl}" download class="bg-white border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-medium py-3 px-6 rounded-xl transition-colors flex items-center justify-center gap-2">
                                    <i data-lucide="download" class="w-5 h-5"></i> Download PDF
                                </a>
                            </div>
                        </div>
                        
                        <div class="mt-12 text-center text-sm text-slate-500">
                            Please save this link or download the file immediately.
                        </div>
                    </div>
                </div>
            `;
        };

        // ==========================================
        // 5. ROUTING & RENDERING LOGIC
        // ==========================================
        const handleRoute = () => {
            renderHeader();
            renderFooter();
            
            const hash = window.location.hash;
            const appDiv = document.getElementById('main-content');
            
            if (hash === '#admin') {
                if (STATE.isAdminAuthenticated) {
                    appDiv.innerHTML = renderAdminDashboard();
                    bindAdminEvents();
                } else {
                    appDiv.innerHTML = renderAdminLogin();
                    bindLoginEvents();
                }
            } else if (hash.startsWith('#access/')) {
                const id = hash.split('/')[1];
                appDiv.innerHTML = renderAccessView(id);
                
                // Track "Purchase/Access" Analytics exactly once per session per product
                if (!sessionStorage.getItem(`purchased_${id}`)) {
                    sessionStorage.setItem(`purchased_${id}`, 'true');
                    window.appMethods.incrementPurchase(id);
                }
            } else {
                appDiv.innerHTML = renderHome();
            }
            
            lucide.createIcons();
        };

        window.addEventListener('hashchange', handleRoute);

        // ==========================================
        // 6. BUSINESS LOGIC & EVENT BINDING
        // ==========================================
        window.appMethods = {
            handleBuy: (productId) => {
                const product = productsList.find(p => p.id === productId);
                if (product && product.paymentLink) {
                    window.open(product.paymentLink, '_blank');
                    showToast("Redirecting to secure payment.", "info");
                    
                    setTimeout(() => {
                        if(confirm("DEMO: Assume payment successful. View the secret product URL?")) {
                            window.location.hash = `#access/${product.id}`;
                        }
                    }, 2000);
                }
            },
            incrementPurchase: async (productId) => {
                try {
                    const productRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productId);
                    const product = productsList.find(p => p.id === productId);
                    if (product) {
                        await updateDoc(productRef, { purchases: (product.purchases || 0) + 1 });
                    }
                } catch (e) {
                    console.error("Failed to increment stats", e);
                }
            },
            logoutAdmin: () => {
                STATE.isAdminAuthenticated = false;
                showToast("Logged out of Admin Panel");
                handleRoute();
            },
            deleteProduct: async (productId) => {
                if (!confirm("Are you sure you want to delete this product?")) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', productId));
                    showToast("Product deleted successfully");
                } catch (error) {
                    showToast("Failed to delete product.", "error");
                }
            },
            copyText: (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast("Secret URL copied to clipboard!");
                } catch (err) {
                    showToast("Failed to copy", "error");
                }
                document.body.removeChild(textArea);
            },
            seedDemoData: async () => {
                try {
                    const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                    const mockPdf = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";
                    const demo1 = { title: "Digital Marketing Mastery", description: "Learn top strategies for marketing.", price: 49.99, paymentLink: "https://stripe.com", imageUrl: "https://images.unsplash.com/photo-1432888498266-38ffec3eaf0a?w=500&q=80", pdfUrl: mockPdf, purchases: 12, createdAt: new Date().toISOString() };
                    const demo2 = { title: "Freelance Success Guide", description: "How to land high paying clients.", price: 29.99, paymentLink: "https://stripe.com", imageUrl: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=500&q=80", pdfUrl: mockPdf, purchases: 5, createdAt: new Date().toISOString() };
                    
                    await addDoc(productsRef, demo1);
                    await addDoc(productsRef, demo2);
                    showToast("Demo products added!");
                } catch(e) {
                    showToast("Failed to add demo data", "error");
                }
            }
        };

        function bindLoginEvents() {
            const form = document.getElementById('admin-login-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const id = document.getElementById('admin-id').value;
                    const pass = document.getElementById('admin-pass').value;
                    
                    // Secure Check (Demo Mode)
                    if (id === 'admin' && pass === 'password123') {
                        STATE.isAdminAuthenticated = true;
                        showToast("Admin access granted.");
                        handleRoute();
                    } else {
                        showToast("Invalid credentials.", "error");
                    }
                });
            }
        }

        async function uploadFileToStorage(file, folder) {
            if (!file || !storage) return null;
            const storageRef = ref(storage, `artifacts/${appId}/${folder}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`);
            await uploadBytes(storageRef, file);
            return await getDownloadURL(storageRef);
        }

        function bindAdminEvents() {
            // Add Product Form
            const addForm = document.getElementById('add-product-form');
            if (addForm) {
                addForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (STATE.isUploading) return;
                    
                    const btn = document.getElementById('submit-btn');
                    const originalBtnText = btn.innerHTML;
                    
                    try {
                        STATE.isUploading = true;
                        btn.innerHTML = `<span class="loader"></span> <span class="ml-2">Uploading...</span>`;
                        btn.disabled = true;
                        btn.classList.add('opacity-75', 'cursor-not-allowed');

                        const title = document.getElementById('prod-title').value;
                        const desc = document.getElementById('prod-desc').value;
                        const price = parseFloat(document.getElementById('prod-price').value);
                        const payLink = document.getElementById('prod-paylink').value;
                        const imageFile = document.getElementById('prod-image').files[0];
                        const pdfFile = document.getElementById('prod-pdf').files[0];

                        if (!pdfFile) throw new Error("PDF file is required.");

                        let imageUrl = null;
                        if (imageFile) imageUrl = await uploadFileToStorage(imageFile, 'images');
                        const pdfUrl = await uploadFileToStorage(pdfFile, 'pdfs');

                        const productsRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                        await addDoc(productsRef, {
                            title, description: desc, price, paymentLink: payLink,
                            imageUrl, pdfUrl, purchases: 0, createdAt: new Date().toISOString()
                        });

                        showToast("Product created!");
                        addForm.reset();
                    } catch (error) {
                        showToast(error.message || "Failed to add product.", "error");
                    } finally {
                        STATE.isUploading = false;
                        btn.innerHTML = originalBtnText;
                        btn.disabled = false;
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    }
                });
            }

            // Settings Form
            const setForm = document.getElementById('settings-form');
            if (setForm) {
                setForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('set-app-name').value;
                    const logoUrl = document.getElementById('set-app-logo').value;
                    
                    try {
                        const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main');
                        await setDoc(settingsRef, { name, logoUrl }, { merge: true });
                        showToast("Global Settings Updated!");
                    } catch (error) {
                        showToast("Failed to save settings.", "error");
                    }
                });
            }
        }

        // ==========================================
        // 7. INITIALIZATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('main-content').innerHTML = `
                <div class="flex justify-center items-center h-64"><span class="loader border-indigo-600"></span></div>
            `;
            await initAuth();
            
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    setupDataListeners();
                } else {
                    if (unsubscribeProducts) unsubscribeProducts();
                    if (unsubscribeSettings) unsubscribeSettings();
                    productsList = [];
                }
            });

            setTimeout(handleRoute, 500);
        });

    </script>
</body>
</html>
